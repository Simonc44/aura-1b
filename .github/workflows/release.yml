name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write          # creation de la release et upload des assets

jobs:
  build-exe:
    name: Build RontoGPT.exe (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependances de build (PyInstaller + cryptography)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cryptography

      - name: Build RontoGPT.exe (bytecode seul, ~8-15 Mo)
        run: python scripts/construire_exe.py

      - name: Empaqueter + checksums SHA-256
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $zip = "RontoGPT-$version-windows.zip"
          Compress-Archive -Path "dist/RontoGPT.exe", "README.md", "LICENSE" -DestinationPath $zip
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$h  $zip" | Out-File -Encoding ascii "checksums-sha256.txt"
          Get-Content checksums-sha256.txt

      - name: Uploader l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: RontoGPT-windows
          path: |
            RontoGPT-*-windows.zip
            checksums-sha256.txt

  build-installer:
    name: Installeur Windows (Inno Setup)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version (tag sans le « v »)
        id: ver
        shell: bash
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Inno Setup n'est PLUS dans l'image `windows-latest` (windows-2025) :
      # il etait cherche sur le disque puis dans le PATH, sans etre installe.
      # Le job echouait donc a coup sur, et comme le job `release` l'exige
      # (`needs`), AUCUNE release ne pouvait plus sortir — l'installeur du
      # paquet n'a jamais ete construit. On l'installe au lieu de l'esperer
      # (choco est preinstalle sur les runners Windows, ~25 s).
      - name: Inno Setup 6 (absent de l'image windows-2025)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe introuvable apres installation" }
          & $iscc /? | Select-Object -First 1

      - name: Compilation Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source }
          & $iscc "/DVersion=${{ steps.ver.outputs.v }}" "/DRacine=$env:GITHUB_WORKSPACE" "packaging\aura.iss"
          Get-ChildItem dist

      - name: Upload de l'installeur
        uses: actions/upload-artifact@v4
        with:
          name: RontoGPT-installeur
          path: dist/RontoGPT-Setup-*.exe

  release:
    name: GitHub Release
    needs: [build-exe, build-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recuperer le build Windows
        uses: actions/download-artifact@v4
        with:
          name: RontoGPT-windows

      - name: Recuperer l'installeur
        uses: actions/download-artifact@v4
        with:
          name: RontoGPT-installeur

      - name: Creer la release avec les notes du tag
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true     # liste auto des PRs/commits depuis le tag precedent
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: false
          files: |
            RontoGPT-*-windows.zip
            RontoGPT-Setup-*.exe
            dist/RontoGPT-Setup-*.exe
            checksums-sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
