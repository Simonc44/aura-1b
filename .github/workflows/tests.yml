name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Les dependances ne sont PLUS ecrites a la main : elles viennent des
  # METADONNEES du projet ([project].dependencies de pyproject.toml) et sont
  # figees par uv.lock. Une liste recopiee ici derive — c'est ainsi que
  # `google-adk`, dependance declaree du projet, a manque et fait echouer
  # tests/test_agents_adk.py a l'import.
  #
  # Verifie : la wheel CPU de llama-cpp-python 0.3.36 est en `py3-none-...`
  # (manylinux2014_x86_64, win_amd64, macosx arm64), donc installable sur les
  # deux OS de la matrice sans compilateur ni Python epingle.
  tests:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: uv (Python ${{ matrix.python-version }} + cache)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Verrou a jour (pyproject.toml <-> uv.lock)
        run: uv lock --check

      - name: Dependances (metadonnees du projet, versions figees)
        run: uv sync --frozen

      - name: "Tests (ordre ALEATOIRE : un etat partage entre tests se voit)"
        env:
          PYTHONIOENCODING: utf-8
        run: uv run --frozen pytest -q

      - name: Diagnostic (chaque echec pytest devient une annotation visible)
        if: failure()
        shell: bash
        run: |
          uv run --frozen pytest -q --tb=short 2>&1 | tee pytest_sortie.txt || true
          { grep -E "^(FAILED|ERROR) " pytest_sortie.txt || true ; } | head -15 | while IFS= read -r ligne; do
            echo "::error::$ligne"
          done
          { grep -E "^E " pytest_sortie.txt || true ; } | head -15 | while IFS= read -r ligne; do
            echo "::error::$ligne"
          done

  # Le format .aef est la signature du projet : on verifie sa chaine
  # complete (forge → signature → boot) sur Linux, où elle n'a jamais tourne
  chaine-aef:
    name: Chaine .aef (forge → signature → boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Dependances (metadonnees du projet)
        run: uv sync --frozen

      - name: Forge + signature + boot d'un mini .aef (faux GGUF)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          uv run --frozen python - <<'PY'
          import os, tempfile
          from pathlib import Path
          from scripts.forger_aef import forger
          from aura import signature, kernel

          tmp = Path(tempfile.mkdtemp())
          faux = tmp / "faux.gguf"
          faux.write_bytes(bytes(range(256)) * 4096)   # 1 Mo
          aef = tmp / "ci.aef"

          # 1. forge (profil_materiel a un repli portable hors Windows)
          forger(faux, aef)

          # 2. signature par une cle de test (la cle de confiance du code
          #    est neutralisee : en CI, la cle reelle n'existe pas)
          import aura.signature as sig
          sig._CLE_CONFIANCE_DEFAUT = ""
          privee, _ = sig.generer_paire(tmp / "k.pem", tmp / "k.pub")
          cle = sig.charger_cle_privee(privee)
          sig.ecrire_signature(aef, cle, identite="CI")

          # 3. boot : verification complete + signature validee
          kernel.CACHE = tmp / "cache"
          cfg = kernel.ouvrir_et_verifier(aef)
          assert cfg["n_ctx"] > 0
          print("Chaine .aef OK sur Linux :", cfg["build"])
          PY

      - name: Alteration detectee (un octet change = refus)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          uv run --frozen python - <<'PY'
          import tempfile
          from pathlib import Path
          from scripts.forger_aef import forger
          from aura import kernel

          tmp = Path(tempfile.mkdtemp())
          faux = tmp / "faux.gguf"
          faux.write_bytes(bytes(range(256)) * 4096)
          aef = tmp / "ci.aef"
          forger(faux, aef)

          corrompu = tmp / "corrompu.aef"
          data = bytearray(aef.read_bytes())
          data[-100] ^= 0xFF
          corrompu.write_bytes(bytes(data))

          kernel.CACHE = tmp / "cache"
          try:
              kernel.ouvrir_et_verifier(corrompu)
          except ValueError as e:
              print("Alteration detectee comme prevu :", e)
          else:
              raise SystemExit("ECHEC : un fichier altere a ete accepte !")
          PY

  # Le typage est un INVARIANT annonce (badge « mypy : 0 ») : il est donc
  # verifie en CI. La version de mypy vient du VERROU (uv.lock), pas d'une
  # epingle recopiee ici : c'est la meme version qui a produit le 0 annonce.
  typage:
    name: mypy (aura/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Dependances (metadonnees du projet, groupe dev inclus)
        run: uv sync --frozen

      - name: mypy aura/
        env:
          PYTHONIOENCODING: utf-8
        run: uv run --frozen mypy aura/

  installateur:
    name: Syntaxe de l'installeur PowerShell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérification de syntaxe (PSParser)
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.PSParser]::Tokenize(
            (Get-Content -Raw "scripts/installer.ps1"), [ref]$errors) | Out-Null
          if ($errors -and $errors.Count) {
            $errors | ForEach-Object {
              Write-Error "ligne $($_.Token.StartLine): $($_.Message)" }
            exit 1
          }
          Write-Host "Syntaxe de l'installeur : OK"
