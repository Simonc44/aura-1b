[project]
name = "aura-1b"
version = "0.1.0"
description = "IA hybride neuro-symbolique : orchestrateur LLM + expert symbolique (PGS) + memoire web (RAG)"
requires-python = ">=3.11"  # tomllib (aura/config.py) n'existe qu'a partir de 3.11
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "gplearn>=0.4.2",
    "ddgs>=9.0",
    "requests>=2.31",
    # 0.3.2 ne sait PAS lire l'architecture `gemma3` (le cerveau par defaut) :
    # `llama_model_load_from_file` echoue et tout le chemin in-process devient
    # inutilisable. 0.3.36 est la premiere version de la serie a embarquer un
    # llama.cpp assez recent pour gemma3 ; la wheel win_amd64 est prebuild
    # (index abetlen), donc aucun compilateur n'est requis.
    "llama-cpp-python==0.3.36",
    "huggingface-hub>=0.25",
    "cryptography>=50.0.1",
    "pywebview>=6.0",  # GUI web (aura/gui_web.py) : fenetre frameless + pont JS <-> Python
    "onnxruntime>=1.24.3",
    "tokenizers>=0.23.2",
    "google-adk>=2.12.0",  # agents ADK opt-in (AURA_ADK=1) : aura/agents_adk.py
]

[project.scripts]
rontogpt = "aura.__main__:main"
aura = "aura.__main__:main"  # alias historique

[project.optional-dependencies]
mamba = ["torch>=2.2", "transformers>=4.46"]
rwkv_legacy = ["rwkv>=0.8", "tiktoken>=0.5"]
interp = ["torch>=2.2", "transformers>=4.46", "transformer_lens>=2.0"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8.0",
    "mypy>=1.10",
]

[[tool.uv.index]]
name = "abetlen-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu/"

[tool.uv.sources]
llama-cpp-python = { index = "abetlen-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `rontogpt` porte le nom public : sans lui dans la wheel, `python -m rontogpt`
# marcherait depuis la racine du depot (CWD dans sys.path) mais pas une fois
# le projet installe.
packages = ["aura", "rontogpt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
# Stubs absents pour les libs scientifiques : on n'insiste pas dessus.
[[tool.mypy.overrides]]
module = [
    "sklearn.*", "joblib.*", "scipy.*", "gplearn.*",
    "ddgs.*", "duckduckgo_search.*", "llama_cpp.*",
    "chiffrement", "signature", "kernel",
]
ignore_missing_imports = true

# `datasets` (HF) merite son PROPRE bloc : pas de py.typed, et
# `load_dataset` n'est pas dans __all__ (reexport dynamique), donc mypy croit
# qu'il n'existe pas. `ignore_missing_imports` ne suffit pas pour un paquet
# dont la SOURCE est presente — mypy l'analyse. `follow_imports = "skip"` le
# rend opaque. Bloc separe VOLONTAIREMENT : mis dans le bloc ci-dessus, le
# `skip` relacherait aussi sklearn/scipy, ou mypy voit pourtant du vrai code.
# Utilise par scripts/mesure_gsm8k_aura.py.
[[tool.mypy.overrides]]
module = ["datasets", "datasets.*"]
follow_imports = "skip"
