[project]
name = "aura-1b"
version = "0.1.0"
description = "IA hybride neuro-symbolique : orchestrateur LLM + expert symbolique (PGS) + memoire web (RAG)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "gplearn>=0.4.2",
    "ddgs>=9.0",
    "requests>=2.31",
    "llama-cpp-python==0.3.2",  # wheel MSVC officielle (index abetlen) : 0.3.35 a un bug CPU_REPACK qui casse le chargement LoRA
    "huggingface-hub>=0.25",
    "cryptography>=50.0.1",
]

[project.optional-dependencies]
mamba = ["torch>=2.2", "transformers>=4.46"]
rwkv_legacy = ["rwkv>=0.8", "tiktoken>=0.5"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8.0",
    "mypy>=1.10",
]

[[tool.uv.index]]
name = "abetlen-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu/"

[tool.uv.sources]
llama-cpp-python = { index = "abetlen-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aura"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
# Stubs absents pour les libs scientifiques : on n'insiste pas dessus.
[[tool.mypy.overrides]]
module = [
    "sklearn.*", "joblib.*", "scipy.*", "gplearn.*",
    "ddgs.*", "duckduckgo_search.*", "llama_cpp.*",
    "chiffrement", "signature", "kernel",
]
ignore_missing_imports = true
