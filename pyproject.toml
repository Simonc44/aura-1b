[project]
name = "aura-1b"
version = "0.1.0"
description = "IA hybride neuro-symbolique : orchestrateur LLM + expert symbolique (PGS) + memoire web (RAG)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "gplearn>=0.4.2",
    "ddgs>=9.0",
    "requests>=2.31",
]

[project.optional-dependencies]
mamba = ["torch>=2.2", "transformers>=4.46"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aura"]

[tool.pytest.ini_options]
testpaths = ["tests"]
